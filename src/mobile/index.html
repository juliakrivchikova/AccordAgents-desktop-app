<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eceef2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
    <title>AccordAgents</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/accordagents-mark.png" />
    <link rel="stylesheet" href="mobile-app.css?v=2026-09-23-pwa-choice-card-v2" />
  </head>
  <body>
    <div class="mobile-stage">
      <main class="mobile-phone" data-screen-label="Mobile control">
        <div class="mobile-status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="mobile-status-icons">
            <span class="mobile-signal"></span>
            <span class="mobile-battery"></span>
          </span>
        </div>
        <section id="chats-screen" class="mobile-screen is-active" aria-label="Chats">
          <header class="mobile-chats-header">
            <h1>Chats</h1>
          </header>
          <!-- Filters the list already on the phone by title, last sender and
               last message; nothing is asked of the desktop. -->
          <div id="chat-search" class="mobile-chat-search" hidden>
            <input id="chat-search-input" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
            <button id="chat-search-close" class="mobile-chat-search-close" type="button">Cancel</button>
          </div>
          <button id="enable-alerts" class="mobile-alerts-banner" type="button" hidden>Enable message alerts</button>
          <div id="chat-list-refresh" class="pull-refresh" aria-hidden="true"><span class="pull-refresh-spinner"></span></div>
          <div id="chat-list" class="mobile-chat-list mscroll" aria-live="polite"></div>
        </section>
        <!-- What members are doing across every chat, from what the relay
             already delivered: runs in progress, questions waiting for you,
             and finished updates. -->
        <section id="activity-screen" class="mobile-screen" aria-label="Activity">
          <header class="mobile-chats-header">
            <h1>Activity</h1>
          </header>
          <div id="activity-tabs" class="act-tabs" role="group" aria-label="Activity lists"></div>
          <div id="activity-list" class="act-list mscroll" aria-live="polite"></div>
          <!-- A choice opened from Activity, answered in full. -->
          <section id="activity-item" class="act-item" aria-label="Waiting for you" hidden>
            <header class="mobile-chat-header">
              <button id="activity-item-back" class="mobile-icon-button" type="button" aria-label="Back to Activity">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-6-6 6-6"></path>
                </svg>
              </button>
              <div class="mobile-title">
                <span id="activity-item-title" class="mobile-title-name" role="heading" aria-level="1"></span>
                <span id="activity-item-sub" class="mobile-title-state"></span>
              </div>
              <button id="activity-item-open" class="act-open-chat" type="button" aria-label="Open in chat">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 7h10v10"></path>
                  <path d="M7 17 17 7"></path>
                </svg>
              </button>
            </header>
            <div id="activity-item-body" class="act-detail mscroll"></div>
          </section>
        </section>
        <section id="settings-screen" class="mobile-screen" aria-label="Settings">
          <header class="mobile-chats-header">
            <h1>Settings</h1>
          </header>
          <div id="settings-list" class="set-list mscroll"></div>
        </section>
        <section id="timeline-screen" class="mobile-screen" aria-label="Chat timeline">
          <header class="mobile-chat-header">
            <button id="back-to-timeline" class="mobile-icon-button thread-back" type="button" aria-label="Back to the chat">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <button id="back-to-chats" class="mobile-icon-button" type="button" aria-label="Back to chats">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <!-- The title is the way to the members: who is in this chat, their
                 role and where each of them runs. -->
            <button id="chat-members-toggle" class="mobile-title" type="button" aria-haspopup="dialog" aria-controls="members-sheet" aria-expanded="false">
              <span id="chat-title" class="mobile-title-name" role="heading" aria-level="1">AccordAgents</span>
              <span id="connection-state" class="mobile-title-state">Waiting to sync</span>
            </button>
            <span class="mobile-header-spacer" aria-hidden="true"></span>
          </header>
          <div id="timeline-refresh" class="pull-refresh" aria-hidden="true"><span class="pull-refresh-spinner"></span></div>
          <section class="thread-surface mscroll" aria-live="polite">
            <button id="load-earlier" class="load-earlier" type="button" hidden>Show earlier messages</button>
            <ol id="message-list" class="message-list"></ol>
          </section>
          <!-- Members of the open chat, from the list the desktop already sent. -->
          <div id="members-sheet" class="members-sheet" role="dialog" aria-label="Members" hidden>
            <div class="members-sheet-backdrop" data-members-close="1"></div>
            <div class="members-sheet-panel">
              <div class="members-sheet-grip" aria-hidden="true"></div>
              <div class="members-sheet-head">
                <strong id="members-sheet-title">Members</strong>
                <button id="members-sheet-close" class="members-sheet-close" type="button" aria-label="Close">Done</button>
              </div>
              <div id="members-sheet-list" class="members-sheet-list"></div>
            </div>
          </div>
          <!-- A picture at full size. Tap anywhere to go back. -->
          <div id="image-viewer" class="image-viewer" role="dialog" aria-label="Picture" hidden>
            <button id="image-viewer-close" class="image-viewer-close" type="button" aria-label="Close picture">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18M6 6l12 12"></path>
              </svg>
            </button>
            <div class="image-viewer-body mscroll"><img id="image-viewer-image" alt="" /></div>
          </div>
          <!-- W-M: tapping the in-progress row opens the reply as it is written.
               A view of its own, so the timeline itself stays calm. -->
          <section id="stream-view" class="stream-view" aria-label="Live reply" hidden>
            <header class="stream-view-head">
              <button id="stream-close" class="mobile-icon-button" type="button" aria-label="Back to the chat">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-6-6 6-6"></path>
                </svg>
              </button>
              <div class="stream-view-title">
                <strong id="stream-label">Agent</strong>
                <span id="stream-state">Writing…</span>
              </div>
              <button id="stream-stop" class="stream-stop" type="button" aria-label="Stop response" hidden>Stop</button>
            </header>
            <div id="stream-body" class="stream-view-body mscroll"></div>
          </section>
          <!-- Permissions and choices a member is waiting on. The same cards
               the desktop shows, answered from here with the same effect. -->
          <section id="control-cards" class="control-cards" aria-label="Waiting for you" hidden></section>
          <!-- Rule 3: the phone wakes its machine itself, with the scoped key
               handed over sealed at pairing. -->
          <section id="machine-wake" class="machine-wake" aria-label="Machine power" hidden></section>
          <button id="jump-to-latest" class="jump-to-latest" type="button" aria-label="Jump to latest message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M19 12l-7 7-7-7"></path>
            </svg>
            Latest
          </button>
          <!-- A message opened on its own screen offers to answer it in a
               thread, the way Slack's message screen does. -->
          <div id="thread-reply-action" class="thread-reply-action" hidden>
            <button id="thread-reply-button" class="thread-reply-button" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 20.5l1.6-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"></path>
              </svg>
              <span>Reply in thread</span>
            </button>
          </div>
          <!-- Waiting for messages must look different from having none: this
               says which of the two it is. It sits at the bottom, where new
               messages land and the User is already looking. -->
          <div id="timeline-syncing" class="timeline-syncing" role="status" hidden>
            <span class="timeline-syncing-spinner" aria-hidden="true"></span>
            <span>Looking for new messages&hellip;</span>
          </div>
          <form id="composer-form" class="composer">
            <div id="mention-menu" class="mobile-mention-menu" role="listbox" aria-label="Members" hidden></div>
            <!-- The "/" menu: commands, saved prompts and skills, as the desktop
                 composer lists them, answered by the desktop on request. -->
            <div id="slash-menu" class="mobile-mention-menu mobile-slash-menu" role="listbox" aria-label="Commands" hidden></div>
            <div id="composer-attachments" class="composer-attachments" aria-label="Attached pictures" hidden></div>
            <input id="composer-image-input" class="composer-image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
            <div class="composer-input-wrap">
              <textarea id="composer-input" name="message" rows="1" placeholder="Message the room..." aria-label="Message the room" aria-autocomplete="list" aria-controls="mention-menu slash-menu" aria-expanded="false" autocomplete="off"></textarea>
              <div class="composer-toolbar">
                <button id="attach-button" class="composer-tool" type="button" aria-label="Attach a picture">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"></path>
                  </svg>
                </button>
                <button id="mention-button" class="composer-tool composer-tool-glyph" type="button" aria-label="Mention a member" aria-controls="mention-menu">@</button>
                <button id="send-button" class="composer-send" type="submit" aria-label="Send message">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7"></path>
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </section>
        <!-- The bottom bar: Chats, Activity and Settings, with search on its
             own button beside it. It floats over the home screens; inside a
             chat it sits under the composer and leaves while the keyboard
             is up. -->
        <div id="home-dock" class="pb-dock" hidden>
          <nav class="pb-bar" aria-label="Primary">
            <button type="button" class="pb-tab" data-home-tab="chats" data-active="true" aria-current="page">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Chats</span>
            </button>
            <button type="button" class="pb-tab" data-home-tab="activity" data-active="false" aria-label="Activity">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
              </svg>
              <span id="activity-badge" class="pa-badge" hidden></span>
              <span>Activity</span>
            </button>
            <button type="button" class="pb-tab" data-home-tab="settings" data-active="false">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Settings</span>
            </button>
          </nav>
          <button id="chat-search-toggle" class="pb-search" type="button" aria-label="Search chats" aria-expanded="false" aria-controls="chat-search">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
          </button>
        </div>
        <div class="mobile-home-indicator" aria-hidden="true"><span></span></div>
      </main>
    </div>
    <!-- The database description both the page and the service worker load. -->
    <script src="mobile-db.js?v=2026-09-23-pwa-choice-card-v2" defer></script>
    <script src="jsqr.js?v=2026-09-23-pwa-choice-card-v2" defer></script>
    <script src="mobile-event-log.js?v=2026-09-07-event-log-v1" defer></script>
    <script src="mobile-machine-wake.js?v=2026-09-07-wake-v1" defer></script>
    <script src="mobile-machine-sealing.js?v=2026-09-07-pair-sealing-v1" defer></script>
    <script src="mobile-machine-command.js?v=2026-09-07-machine-command-v1" defer></script>
    <script src="mobile-machine-channel.js?v=2026-09-07-machine-channel-v1" defer></script>
    <!-- Rules shared with the desktop verbatim (avatars, timeline visibility),
         bundled from src/shared by the mobile build. -->
    <script src="mobile-shared.js?v=2026-09-23-pwa-choice-card-v2" defer></script>
    <script src="mobile-activity.js?v=2026-09-23-pwa-choice-card-v2" defer></script>
    <script src="mobile-app.js?v=2026-09-23-pwa-choice-card-v2" defer></script>
  </body>
</html>
