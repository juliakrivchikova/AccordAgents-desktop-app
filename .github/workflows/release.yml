name: Release

# Releases are started by hand, never by a merge: the "Run workflow" button in
# GitHub, or `gh workflow run release.yml --ref beta -f target=beta`.
#   beta              bumps beta to the next -beta.N and publishes it (run on beta)
#   patch|minor|major bumps main and publishes a stable release (run on main)
#   build-only        builds, signs, notarizes and launch-checks the selected
#                     branch without bumping or publishing; keeps only checksums
#                     and the launch screenshot and log (and, for a week, the
#                     unsigned Windows installer, so it can be tried by hand)
# A release ships exactly the commit the run was started for: if the branch
# moved meanwhile, the run stops before it uses a version.
#
# Once macOS is published, the Windows x64 job builds the same tag, launch-checks
# it, adds its installer and update files and a Windows section of the notes to
# the same GitHub Release, then installs the published installer and launches
# it. Windows builds are not code-signed yet. A failed Windows job uses no
# version; a re-run of just that job builds again and replaces its own files
# and notes section, never the macOS ones.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD  Developer ID Application identity
#   APPLE_CODESIGN_IDENTITY, APPLE_TEAM_ID, MACOS_BUNDLE_ID,
#   APPLE_NOTARIZE_APPLE_ID, APPLE_NOTARIZE_PASSWORD          same values as the local .env.local
#   RELEASE_REPOS_TOKEN  fine-grained token with Contents read/write on the two release repos
#   CLOUDFLARE_API_TOKEN Cloudflare token that can deploy the phone app's Pages project
#
# A beta release also deploys the phone app (PWA) built from the released
# commit to mobile.accordagents.com; a trial build deploys it to a preview
# branch only. Stable releases leave the phone app alone: main is older than
# beta and would roll the phone back.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "beta (from beta), patch/minor/major (from main), or build-only (no bump, no publish)"
        type: choice
        options:
          - beta
          - patch
          - minor
          - major
          - build-only
        default: beta

permissions:
  contents: write

# One release at a time. GitHub keeps only the newest waiting run per group,
# so trial builds get their own group and never cancel a waiting release.
concurrency:
  group: ${{ inputs.target == 'build-only' && 'release-build-only' || 'release' }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.target }} from ${{ github.ref_name }}
    runs-on: macos-26
    timeout-minutes: 240
    env:
      TARGET: ${{ inputs.target }}
    outputs:
      version: ${{ steps.published.outputs.version }}
    steps:
      - name: Check the branch matches the release target
        run: |
          case "$TARGET" in
            beta) expected=beta ;;
            patch|minor|major) expected=main ;;
            *) exit 0 ;;
          esac
          if [ "$GITHUB_REF" != "refs/heads/$expected" ]; then
            echo "::error::A $TARGET release runs from $expected, not $GITHUB_REF_NAME."
            exit 1
          fi

      # No stored credentials: dependency install scripts and the build never
      # see a token that can push. The release script hands one to its push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the Node environment
        run: node .agents/skills/release-beta/scripts/verify-release.mjs environment

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the dependency tree
        run: node .agents/skills/release-beta/scripts/verify-release.mjs preflight

      - name: Find the release repo
        if: inputs.target != 'build-only'
        run: |
          set -euo pipefail
          repo="$(node scripts/release-mac-arm64.mjs "$TARGET" --dry-run | sed -n 's/^Release repo: //p')"
          if [ -z "$repo" ]; then
            echo "::error::Could not determine the release repo for $TARGET."
            exit 1
          fi
          echo "RELEASE_REPO=$repo" >> "$GITHUB_ENV"

      # Publishing happens after the build, so a missing or read-only token
      # would waste the run. Creating and deleting a branch in each release
      # repo proves the token can write there; trial builds check it too.
      - name: Check the release-repo token can publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_REPOS_TOKEN must be set."
            exit 1
          fi
          for target in beta patch; do
            repo="$(node scripts/release-mac-arm64.mjs "$target" --dry-run | sed -n 's/^Release repo: //p')"
            branch="$(gh api "repos/$repo" --jq .default_branch)"
            sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq .object.sha)"
            probe="refs/heads/release-token-probe-$GITHUB_RUN_ID"
            gh api --method POST "repos/$repo/git/refs" -f ref="$probe" -f sha="$sha" > /dev/null
            gh api --method DELETE "repos/$repo/git/$probe"
            echo "The token can write to $repo."
          done

      # The phone app is deployed after the beta is published; a token that
      # cannot see the Pages project should stop the run before that.
      - name: Check the Cloudflare token can deploy the phone app
        if: inputs.target == 'beta' || inputs.target == 'build-only'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 72a0b869752e9838a0b5b21b2e4558b0
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN must be set."
            exit 1
          fi
          npx wrangler pages deployment list --project-name accordagents-mobile-control-staging > /dev/null
          echo "The Cloudflare token can reach the phone app's Pages project."

      # A release bumps and tags before it notarizes, so an expired Apple
      # agreement would burn a version. Uploading a tiny file fails fast then.
      - name: Check Apple accepts notarization uploads
        if: inputs.target != 'build-only'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/notarization-probe"
          mkdir -p "$probe"
          echo "AccordAgents notarization probe" > "$probe/probe.txt"
          ditto -c -k --keepParent "$probe" "$RUNNER_TEMP/notarization-probe.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization-probe.zip" \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARIZE_PASSWORD"

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_P12_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 and MACOS_CERTIFICATE_PASSWORD must be set."
            exit 1
          fi
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          # -x: the private key cannot be exported again from this keychain.
          security import "$p12" -k "$keychain" -f pkcs12 -x -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Everything the build needs, checked before a version is used. The
      # bundle id must stay the one users already have: their updates are
      # refused if it changes.
      - name: Check the signing settings
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          MACOS_BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPLE_CODESIGN_IDENTITY APPLE_TEAM_ID APPLE_NOTARIZE_APPLE_ID APPLE_NOTARIZE_PASSWORD MACOS_BUNDLE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set."
              exit 1
            fi
          done
          case "$APPLE_CODESIGN_IDENTITY" in
            "Developer ID Application: "*"($APPLE_TEAM_ID)") ;;
            *) echo "::error::APPLE_CODESIGN_IDENTITY must be a Developer ID Application identity of team APPLE_TEAM_ID."; exit 1 ;;
          esac
          identities="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          if ! grep -qF "\"$APPLE_CODESIGN_IDENTITY\"" <<< "$identities"; then
            echo "::error::The imported certificate is not APPLE_CODESIGN_IDENTITY."
            exit 1
          fi
          if [ "$TARGET" != "build-only" ]; then
            product="$(node -p 'const p = require("./package.json"); p.productName || p.name')"
            previous="$RUNNER_TEMP/previous"
            gh release download --repo "$RELEASE_REPO" --pattern '*-darwin-arm64.zip' --dir "$previous"
            unzip -q "$previous"/*-darwin-arm64.zip "$product.app/Contents/Info.plist" -d "$previous"
            bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$previous/$product.app/Contents/Info.plist")"
            rm -rf "$previous"
            if [ "$bundle_id" != "$MACOS_BUNDLE_ID" ]; then
              echo "::error::MACOS_BUNDLE_ID differs from the bundle id of the latest release in $RELEASE_REPO; installed apps would refuse the update."
              exit 1
            fi
          fi
          echo "Signing settings are complete and match the published app."

      - name: Build, sign and notarize without publishing
        if: inputs.target == 'build-only'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          MACOS_BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
        run: npm run signed:mac-arm64

      - name: Release
        if: inputs.target != 'build-only'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          MACOS_BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_REPOS_TOKEN }}
          SOURCE_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The update feed is checked below, without failing a published release.
          node scripts/release-mac-arm64.mjs "$TARGET" --skip-update-check --expect-head "$GITHUB_SHA"

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Check the published download
        id: published
        if: inputs.target != 'build-only'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOS_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          product="$(node -p 'const p = require("./package.json"); p.productName || p.name')"
          version="$(node -p 'require("./package.json").version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir"
          gh release download "v$version" --repo "$RELEASE_REPO" --dir "$dir"
          # The published bytes must be the ones this run built and checked.
          (cd "$dir" && shasum -a 256 -c "$GITHUB_WORKSPACE"/signed/*.sha256)
          ditto -x -k "$dir/$product-$version-darwin-arm64.zip" "$dir/unpacked"
          app="$dir/unpacked/$product.app"
          dmg="$dir/$product-$version-arm64.dmg"
          node .agents/skills/release-beta/scripts/verify-release.mjs packaged "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          team="$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$team" != "$APPLE_TEAM_ID" ]; then
            echo "::error::The published app is signed by team $team, not by ours."
            exit 1
          fi
          spctl -a -vv --type exec "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl -a -vv --type open --context context:primary-signature "$dmg"
          node scripts/smoke-launch-packaged-app.mjs "$app" \
            --screenshot "$RUNNER_TEMP/launch/published.png" --log "$RUNNER_TEMP/launch/published.log"

      - name: Keep checksums and launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            signed/*.sha256
            out/launch/
            ${{ runner.temp }}/launch/
          retention-days: 30
          if-no-files-found: ignore

      # update.electronjs.org often answers 204 for some minutes after a
      # publish. A lagging feed is reported, not treated as a failed release.
      - name: Check the update feed
        if: inputs.target != 'build-only'
        continue-on-error: true
        run: |
          previous="$(git show HEAD~1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          url="https://update.electronjs.org/$RELEASE_REPO/darwin-arm64/$previous"
          for attempt in $(seq 1 10); do
            if curl -fsS "$url" | grep -qF "$VERSION"; then
              echo "The update feed offers $VERSION to $previous: $url"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::The update feed does not offer $VERSION to $previous yet ($url). The release is published; check the feed again instead of re-running."
          exit 1

  windows:
    name: Windows x64
    needs: release
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # A release builds the exact tag the macOS job pushed; the parent commit
      # gives the version the update feed is checked from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target == 'build-only' && github.sha || format('refs/tags/v{0}', needs.release.outputs.version) }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the Node environment
        run: node .agents/skills/release-beta/scripts/verify-release.mjs environment

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the dependency tree
        run: node .agents/skills/release-beta/scripts/verify-release.mjs preflight

      - name: Build and check without publishing
        if: inputs.target == 'build-only'
        run: npm run release:windows-x64 -- --build-only

      - name: Find the release repo
        if: inputs.target != 'build-only'
        run: |
          set -euo pipefail
          repo="$(node scripts/release-windows-x64.mjs --skip-update-check --dry-run | sed -n 's/^Release repo: //p')"
          if [ -z "$repo" ]; then
            echo "::error::Could not determine the release repo for $VERSION."
            exit 1
          fi
          echo "RELEASE_REPO=$repo" >> "$GITHUB_ENV"

      # Builds, launch-checks, then adds the files to the release macOS published.
      - name: Publish
        if: inputs.target != 'build-only'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOS_TOKEN }}
        run: npm run release:windows-x64 -- --repo "$RELEASE_REPO" --skip-update-check

      # The release repos are public: reading needs no token that can write
      # there, and none reaches the installer or the app below.
      - name: Download the published files
        if: inputs.target != 'build-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$RUNNER_TEMP")/published"
          mkdir -p "$dir"
          gh release download "v$VERSION" --repo "$RELEASE_REPO" --dir "$dir" \
            --pattern '*-win32-x64-Setup.exe' --pattern '*-full.nupkg' --pattern RELEASES

      # Installs the installer the way a user does and launches the installed
      # app with a throwaway profile: the published installer for a release,
      # the built one for a trial build.
      - name: Install and launch the installer
        run: |
          set -euo pipefail
          # Windows paths in the runner's variables do not glob in bash.
          workspace="$PWD"
          if [ "$TARGET" = "build-only" ]; then
            dir="$workspace/out/windows-release"
          else
            dir="$(cygpath -u "$RUNNER_TEMP")/published"
            # The published bytes must be the ones this job built and checked.
            (cd "$dir" && sha256sum -c "$workspace"/out/windows-release/*.sha256)
          fi
          "$dir"/*-win32-x64-Setup.exe --silent
          # Squirrel installs <id>-<version>-full.nupkg into <id>/app-<version>.
          id="$(node -p 'require("./package.json").name.replace(/-/g, "_")')"
          exe="$(node -p 'const p = require("./package.json"); p.productName || p.name').exe"
          package="$(basename "$(ls out/windows-release/*-full.nupkg)" -full.nupkg)"
          app="$(cygpath -u "$LOCALAPPDATA")/$id/app-${package#"$id"-}"
          for attempt in $(seq 1 60); do
            [ -f "$app/$exe" ] && break
            sleep 2
          done
          if [ ! -f "$app/$exe" ]; then
            echo "::error::The installer did not install $package at $app."
            exit 1
          fi
          # Squirrel may start the app after installing; the check starts its own.
          taskkill //IM "$exe" //T //F > /dev/null 2>&1 || true
          node .agents/skills/release-beta/scripts/verify-release.mjs packaged "$app"
          node scripts/smoke-launch-packaged-app.mjs "$app" \
            --screenshot "$RUNNER_TEMP/launch/installed.png" --log "$RUNNER_TEMP/launch/installed.log"

      - name: Keep checksums and launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-evidence
          path: |
            out/windows-release/*.sha256
            out/launch/
            ${{ runner.temp }}/launch/
          retention-days: 30
          if-no-files-found: ignore

      # A trial build is not published anywhere, so its installer is kept for a
      # week to be installed and tried by hand.
      - name: Keep the trial installer
        if: inputs.target == 'build-only'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-trial-installer
          path: out/windows-release/*-win32-x64-Setup.exe
          retention-days: 7
          if-no-files-found: error

      # Like the macOS check: a lagging feed is reported, not a failed release.
      - name: Check the update feed
        if: inputs.target != 'build-only'
        continue-on-error: true
        run: |
          previous="$(git show HEAD~1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          package="$(basename "$(ls out/windows-release/*-full.nupkg)")"
          url="https://update.electronjs.org/$RELEASE_REPO/win32-x64/$previous/RELEASES"
          for attempt in $(seq 1 10); do
            if curl -fsS "$url" | grep -qF "/$package "; then
              echo "The update feed offers $package to $previous: $url"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::The update feed does not offer $package to $previous yet ($url). The release is published; check the feed again instead of re-running."
          exit 1

  phone-app:
    name: Phone app
    needs: release
    if: inputs.target == 'beta' || inputs.target == 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a0b869752e9838a0b5b21b2e4558b0
      PAGES_PROJECT: accordagents-mobile-control-staging
      # The custom domain serves the Pages production branch, which is
      # called staging. Trial builds go to a preview branch the phone never sees.
      PAGES_BRANCH: ${{ inputs.target == 'beta' && 'staging' || 'release-trial' }}
      SITE: ${{ inputs.target == 'beta' && 'https://mobile.accordagents.com' || 'https://release-trial.accordagents-mobile-control-staging.pages.dev' }}
    steps:
      # A beta deploys the phone app from the exact commit it released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target == 'beta' && format('refs/tags/v{0}', needs.release.outputs.version) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The phone app needs only esbuild and wrangler, both shipped as
      # prebuilt binaries; no install script has to run.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the phone app
        run: npm run build:mobile

      - name: Deploy the phone app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          npx wrangler pages deploy dist/mobile --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH" \
            --commit-hash "$sha" --commit-message "Release workflow ${GITHUB_RUN_ID} at ${sha}"

      # Ask the address the phone uses, not the deploy output.
      - name: Check the site serves this build
        run: |
          set -euo pipefail
          expected_worker="$(shasum -a 256 dist/mobile/service-worker.js | cut -d' ' -f1)"
          expected_app="$(shasum -a 256 dist/mobile/mobile-app.js | cut -d' ' -f1)"
          for attempt in $(seq 1 20); do
            worker="$(curl -fsS -H 'Cache-Control: no-cache' "$SITE/service-worker.js?check=$GITHUB_RUN_ID-$attempt" | shasum -a 256 | cut -d' ' -f1 || true)"
            app="$(curl -fsS -H 'Cache-Control: no-cache' "$SITE/mobile-app.js?check=$GITHUB_RUN_ID-$attempt" | shasum -a 256 | cut -d' ' -f1 || true)"
            if [ "$worker" = "$expected_worker" ] && [ "$app" = "$expected_app" ]; then
              echo "$SITE serves this build ($(grep -o 'ASSET_VERSION = "[^"]*"' dist/mobile/service-worker.js))."
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SITE does not serve the build this run deployed."
          exit 1
