name: Windows release

# Windows x64 ships only with stable releases, signed with the Certum
# certificate, whose key is reachable only from the User's Windows PC through
# SimplySign Desktop. A stable Release run starts this workflow for its tag; it
# can also be started by hand for a tag, or without one as a trial of the
# selected branch that publishes nothing:
#   gh workflow run windows-release.yml --ref main -f tag=v1.12.0
#   gh workflow run windows-release.yml --ref beta
#
#   Build    builds the unsigned app from the tag, checks its archive and
#            launches it, and keeps it as the windows-unsigned-app artifact.
#   Publish  waits for approval in the windows-signing environment. On the
#            Windows PC, `npm run sign:windows-x64 -- --run <run id>` signs that
#            app, packs and signs the installer, puts the files in the draft
#            release windows-signed-<run id> of this repository and approves
#            the job. The job checks the signatures, installs and launches the
#            installer on a clean machine, and only then adds the update files,
#            then the installer, to the GitHub Release of the tag.
#
# One-time setup: Settings → Environments → New environment "windows-signing",
# Required reviewers: the User. Secret: RELEASE_REPOS_TOKEN, as in release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to add Windows to (v1.12.0); empty for a trial build that publishes nothing"
        type: string
        default: ""

run-name: ${{ inputs.tag && format('Windows {0}', inputs.tag) || format('Windows trial of {0}', github.ref_name) }}

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      commit: ${{ steps.info.outputs.commit }}
      version: ${{ steps.info.outputs.version }}
    steps:
      # The macOS build checks out with LF line endings; text files the app
      # ships byte for byte (skills and prompts, the cloud machine runtime) must
      # be the same here, or a machine used from both desktops is reinstalled
      # by each.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check what is being built
        id: info
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$TAG" ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "::error::$TAG holds version $version, so it is not a release tag."
              exit 1
            fi
            case "$version" in
              *-*) echo "::error::Windows ships only with stable releases; $version is a prerelease."; exit 1 ;;
            esac
          fi
          commit="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/build-info"
          printf '{"version":"%s","commit":"%s","tag":"%s"}\n' "$version" "$commit" "$TAG" > "$RUNNER_TEMP/build-info/build.json"
          echo "Building $version from $commit."

      - name: Check the Node environment
        run: node .agents/skills/release-beta/scripts/verify-release.mjs environment

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the dependency tree
        run: node .agents/skills/release-beta/scripts/verify-release.mjs preflight

      - name: Build and check the unsigned app
        run: npm run release:windows-x64 -- --package-only

      - name: Keep the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-app
          # The artifact holds the app's folder itself, named after the product.
          path: out/*-win32-x64/
          include-hidden-files: true
          # As long as the Publish job may wait for its approval.
          retention-days: 30
          if-no-files-found: error

      - name: Keep what was built
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-info
          path: ${{ runner.temp }}/build-info/build.json
          retention-days: 30
          if-no-files-found: error

      - name: Keep the launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-evidence
          path: out/launch/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: build
    runs-on: windows-2025
    # Waits here until the Windows PC has signed the build (see the top).
    environment: windows-signing
    timeout-minutes: 60
    permissions:
      # Drafts are visible only with write access: this job reads and then
      # removes the draft holding the signed files.
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      DRAFT: windows-signed-${{ github.run_id }}
    steps:
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      # The parent commit gives the version the update feed is checked from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || needs.build.outputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      # This job waits for the signature, possibly for days: what it runs and
      # publishes must still be the commit Build built and the PC signed.
      - name: Check the tag still names the built commit
        env:
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$BUILT" ]; then
            echo "::error::$head is checked out, but Build built $BUILT${TAG:+: the tag $TAG has moved}."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Anyone who can write to this repository can write to the draft, so
      # nothing from it runs before its installer proves the release
      # certificate signed it; the update files are tied to that installer
      # after it is installed.
      - name: Download the signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=out/windows-release
          mkdir -p "$dir"
          if ! gh release download "$DRAFT" --repo "$GITHUB_REPOSITORY" --dir "$dir"; then
            echo "::error::The draft $DRAFT of $GITHUB_REPOSITORY has no signed files. On the Windows PC, run: npm run sign:windows-x64 -- --run $GITHUB_RUN_ID"
            exit 1
          fi
          setup="$(node -p 'const p = require("./package.json"); p.productName || p.name')-$VERSION-win32-x64-Setup.exe"
          package="$(cd "$dir" && ls -- *-full.nupkg)"
          files="$(ls "$dir" | sort | tr '\n' ' ')"
          expected="$(printf '%s\n' "$setup" "$setup.sha256" "$package" "$package.sha256" RELEASES RELEASES.sha256 | sort | tr '\n' ' ')"
          if [ "$files" != "$expected" ]; then
            echo "::error::The draft holds $files instead of $expected."
            exit 1
          fi
          (cd "$dir" && sha256sum -c ./*.sha256)
          node scripts/sign-windows-x64.mjs --check "$(cygpath -w "$PWD/$dir/$setup")"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Installs the signed installer the way a user does and launches the
      # installed app with a throwaway profile, before anything is published.
      - name: Install and launch the installer
        run: |
          set -euo pipefail
          dir="$PWD/out/windows-release"
          local_app_data="$(cygpath -u "$LOCALAPPDATA")"
          # Squirrel installs <id>-<version>-full.nupkg into <id>/app-<version>.
          id="$(node -p 'require("./package.json").name.replace(/-/g, "_")')"
          exe="$(node -p 'const p = require("./package.json"); p.productName || p.name').exe"
          package="$(basename "$(ls "$dir"/*-full.nupkg)" -full.nupkg)"
          setup="$(ls "$dir"/*-win32-x64-Setup.exe)"
          root="$local_app_data/$id"
          app="$root/app-${package#"$id"-}"
          logs="$(cygpath -u "$RUNNER_TEMP")/launch/squirrel"
          # Squirrel's own logs explain a failed install.
          trap 'mkdir -p "$logs"; cp "$local_app_data"/SquirrelTemp/*.log "$root"/*.log "$logs"/ 2>/dev/null || true' EXIT
          # A failed install shows a dialog nobody can close: give up instead of
          # waiting for the job timeout.
          timeout 600 "$setup" --silent
          for attempt in $(seq 1 120); do
            if [ -f "$app/$exe" ] && [ -f "$root/packages/RELEASES" ] \
              && ! tasklist //FI "IMAGENAME eq Update.exe" //NH | grep -qi 'Update\.exe'; then
              break
            fi
            sleep 2
          done
          if [ ! -f "$app/$exe" ] || [ ! -f "$root/packages/RELEASES" ]; then
            echo "::error::The installer did not finish installing $package at $app."
            exit 1
          fi
          # Squirrel may start the app after installing; the check starts its own.
          taskkill //IM "$exe" //T //F > /dev/null 2>&1 || true
          # The installer and every binary it installed, as Windows sees them,
          # with Squirrel's Update.exe and the launcher every shortcut starts.
          node scripts/sign-windows-x64.mjs --check "$(cygpath -w "$setup")" "$(cygpath -w "$app")" \
            "$(cygpath -w "$root/Update.exe")" "$(cygpath -w "$root/$exe")"
          # The update files existing installs download must be the ones inside
          # the signed installer, which Squirrel just unpacked into packages/.
          entry() { sed 's/^\xEF\xBB\xBF//' | tr -d '\r' | awk '{ print $1, $2, $3 }'; }
          if ! cmp -s "$dir/$package-full.nupkg" "$root/packages/$package-full.nupkg" \
            || [ "$(entry < "$dir/RELEASES")" != "$(entry < "$root/packages/RELEASES")" ]; then
            echo "::error::The NuGet package or RELEASES differs from the one inside the signed installer."
            exit 1
          fi
          node .agents/skills/release-beta/scripts/verify-release.mjs packaged "$app"
          node scripts/smoke-launch-packaged-app.mjs "$app" \
            --screenshot "$RUNNER_TEMP/launch/installed.png" --log "$RUNNER_TEMP/launch/installed.log"

      - name: Find the release repo
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          repo="$(node scripts/release-windows-x64.mjs --publish-only --skip-update-check --dry-run | sed -n 's/^Release repo: //p')"
          if [ -z "$repo" ]; then
            echo "::error::Could not determine the release repo for $VERSION."
            exit 1
          fi
          echo "RELEASE_REPO=$repo" >> "$GITHUB_ENV"

      # Adds the checked files to the release macOS published, without
      # building; only this step holds the token that can write there.
      - name: Publish
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOS_TOKEN }}
        run: node scripts/release-windows-x64.mjs --publish-only --repo "$RELEASE_REPO" --skip-update-check

      # The release repos are public: reading needs no token that can write there.
      - name: Check the published download
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workspace="$PWD"
          dir="$(cygpath -u "$RUNNER_TEMP")/published"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$RELEASE_REPO" --dir "$dir" \
            --pattern '*-win32-x64-Setup.exe' --pattern '*-full.nupkg' --pattern RELEASES
          # The published bytes must be the ones this job installed and launched.
          (cd "$dir" && sha256sum -c "$workspace"/out/windows-release/*.sha256)

      # A draft left behind does no harm; the release is already done.
      - name: Remove the draft with the signed files
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$DRAFT" --repo "$GITHUB_REPOSITORY" --yes

      - name: Keep checksums and launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-evidence
          path: |
            out/windows-release/*.sha256
            ${{ runner.temp }}/launch/
          retention-days: 30
          if-no-files-found: ignore

      # Like the macOS check, a lagging feed is reported, not a failed release.
      # The feed caches a repo for 15 minutes, so it is asked a little longer.
      - name: Check the update feed
        if: inputs.tag != ''
        continue-on-error: true
        run: |
          previous="$(git show HEAD~1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          url="https://update.electronjs.org/$RELEASE_REPO/win32-x64/$previous/RELEASES"
          # The served entry must be this build's package: same SHA1 and size.
          entry() { sed 's/^\xEF\xBB\xBF//' | tr -d '\r' | awk '{ print $1, $3 }'; }
          expected="$(entry < out/windows-release/RELEASES)"
          for attempt in $(seq 1 18); do
            if [ "$(curl -fsS "$url" | entry)" = "$expected" ]; then
              echo "The update feed offers this build to $previous: $url"
              exit 0
            fi
            sleep 60
          done
          echo "::warning::The update feed does not offer this build to $previous yet ($url). The release is published; check the feed again instead of re-running."
          exit 1
