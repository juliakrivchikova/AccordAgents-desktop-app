name: Windows CI Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-baseline:
    name: Windows x64 runner baseline
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record Windows toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          foreach ($command in @("sqlite3", "codex", "claude", "agy")) {
            $resolved = Get-Command $command -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($resolved) {
              Write-Host "$command -> $($resolved.Source)"
            } else {
              Write-Host "$command -> not found"
            }
          }

      - name: TypeScript checks
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build main process
        id: build_main
        continue-on-error: true
        run: npm run build:main

      - name: Build renderer
        id: build_renderer
        continue-on-error: true
        run: npx vite build

      - name: Test command runtime
        id: test_command
        continue-on-error: true
        run: npm run test:command

      - name: Test CLI readiness
        id: test_cli_readiness
        continue-on-error: true
        run: npm run test:cli-readiness

      - name: Test local file opening
        id: test_file_opener
        continue-on-error: true
        run: npm run test:file-opener

      - name: Test SQLite persistence
        id: test_storage
        continue-on-error: true
        run: npm run test:storage

      - name: Test links and local file references
        id: test_links
        continue-on-error: true
        run: npm run test:links

      - name: Test Accord launcher preferences
        id: test_accord
        continue-on-error: true
        run: npm run test:accord

      - name: Test focused renderer activity path
        id: test_chat_progress_renderer
        continue-on-error: true
        run: npm run test:chat-progress-renderer

      - name: Test renderer component harness
        id: test_renderer_components
        continue-on-error: true
        run: npm run test:renderer-components

      - name: Test platform-neutral service baseline
        id: test_permissions
        continue-on-error: true
        run: npm run test:permissions

      - name: Enforce Windows baseline result
        if: always()
        shell: pwsh
        run: |
          $checks = [ordered]@{
            "typecheck" = "${{ steps.typecheck.outcome }}"
            "build:main" = "${{ steps.build_main.outcome }}"
            "build:renderer" = "${{ steps.build_renderer.outcome }}"
            "test:command" = "${{ steps.test_command.outcome }}"
            "test:cli-readiness" = "${{ steps.test_cli_readiness.outcome }}"
            "test:file-opener" = "${{ steps.test_file_opener.outcome }}"
            "test:storage" = "${{ steps.test_storage.outcome }}"
            "test:links" = "${{ steps.test_links.outcome }}"
            "test:accord" = "${{ steps.test_accord.outcome }}"
            "test:chat-progress-renderer" = "${{ steps.test_chat_progress_renderer.outcome }}"
            "test:renderer-components" = "${{ steps.test_renderer_components.outcome }}"
            "test:permissions" = "${{ steps.test_permissions.outcome }}"
          }

          $failed = @()
          foreach ($entry in $checks.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
            if ($entry.Value -ne "success") {
              $failed += $entry.Key
            }
          }

          if ($failed.Count -gt 0) {
            Write-Error "Windows baseline failed: $($failed -join ', ')"
            exit 1
          }
