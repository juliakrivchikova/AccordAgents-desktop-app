<!doctype html>
<html lang="ru" data-theme="light" data-dir="b">
<head>

<title>AccordAgents UI refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens: what becomes src/renderer/styles/app-theme.css ---------- */
:root {
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --fs-11: 11px; --lh-11: 16px;
  --fs-12: 12px; --lh-12: 16px;
  --fs-13: 13px; --lh-13: 20px;
  --fs-14: 14px; --lh-14: 22px;
  --fs-16: 16px; --lh-16: 24px;
  --fs-20: 20px; --lh-20: 28px;
  --r-4: 4px; --r-6: 6px; --r-8: 8px; --r-12: 12px; --r-full: 999px;
  --h-xs: 24px; --h-sm: 28px; --h-md: 32px;
  --dur-fast: 120ms; --dur: 180ms; --dur-slow: 240ms;
  --ease-out: cubic-bezier(.2, 0, 0, 1);
  --ease-in-out: cubic-bezier(.4, 0, .2, 1);
  --reading: 768px;
  --sidebar-w: 256px;
  --panel-w: 380px;
}
html[data-theme="light"] {
  --bg: #ffffff; --bg-sidebar: #f7f7f8; --bg-panel: #fbfbfc; --bg-subtle: #f3f3f5; --bg-muted: #eaeaed; --bg-elevated: #ffffff; --bg-overlay: rgba(15, 15, 18, .32);
  --border-subtle: #eeeef1; --border: #e4e4e8; --border-strong: #d0d0d6;
  --text: #18181b; --text-2: #4f4f58; --text-3: #6c6c75; --text-disabled: #b6b6bd;
  --success: #15803d; --warning: #b45309; --danger: #dc2626; --info: #2563eb;
  --success-dot: #22c55e; --warning-dot: #f59e0b; --danger-dot: #ef4444; --info-dot: #3b82f6;
  --code-bg: #f4f4f6; --kbd-bg: #f1f1f4;
  --shadow-sm: 0 1px 2px rgba(16, 16, 20, .05);
  --shadow-md: 0 0 0 1px var(--border), 0 8px 24px -6px rgba(16, 16, 20, .14);
  --shadow-lg: 0 0 0 1px var(--border), 0 24px 48px -12px rgba(16, 16, 20, .24);
  --tooltip-bg: #18181b; --tooltip-fg: #fafafa;
}
html[data-theme="dark"] {
  --bg: #121214; --bg-sidebar: #0d0d0f; --bg-panel: #151518; --bg-subtle: #1c1c20; --bg-muted: #26262b; --bg-elevated: #1b1b1f; --bg-overlay: rgba(0, 0, 0, .5);
  --border-subtle: #1f1f23; --border: #29292e; --border-strong: #3a3a41;
  --text: #ececef; --text-2: #b0b0b9; --text-3: #8c8c96; --text-disabled: #4d4d55;
  --success: #4ade80; --warning: #fbbf24; --danger: #f87171; --info: #60a5fa;
  --success-dot: #22c55e; --warning-dot: #f59e0b; --danger-dot: #ef4444; --info-dot: #3b82f6;
  --code-bg: #1d1d21; --kbd-bg: #232328;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 0 0 1px var(--border), 0 10px 28px -6px rgba(0, 0, 0, .6);
  --shadow-lg: 0 0 0 1px var(--border), 0 28px 56px -12px rgba(0, 0, 0, .7);
  --tooltip-bg: #ececef; --tooltip-fg: #121214;
}
/* Direction A: graphite. Accent nearly invisible, like T3 Code and Codex. */
html[data-dir="a"][data-theme="light"] { --primary: #18181b; --primary-fg: #fff; --primary-hover: #2e2e33; --select-bg: var(--bg-muted); --select-fg: var(--text); --link: #2563eb; --focus: rgba(37, 99, 235, .35); --on: #18181b; }
html[data-dir="a"][data-theme="dark"]  { --primary: #ececef; --primary-fg: #121214; --primary-hover: #ffffff; --select-bg: var(--bg-muted); --select-fg: var(--text); --link: #7aa7ff; --focus: rgba(122, 167, 255, .4); --on: #ececef; }
/* Direction B: brand. AccordAgents violet on focus, selection and the primary action. */
html[data-dir="b"][data-theme="light"] { --primary: #7357d0; --primary-fg: #fff; --primary-hover: #6447c4; --select-bg: rgba(115, 87, 208, .10); --select-fg: #5a3fb8; --link: #6447c4; --focus: rgba(115, 87, 208, .35); --on: #7357d0; }
html[data-dir="b"][data-theme="dark"]  { --primary: #8f78e8; --primary-fg: #fff; --primary-hover: #9f8bee; --select-bg: rgba(143, 120, 232, .16); --select-fg: #c7b9ff; --link: #a996f2; --focus: rgba(143, 120, 232, .45); --on: #8f78e8; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation: none !important; } .shimmer { color: var(--text-2) !important; background: none !important; } }

/* ---------- Page chrome (outside the app frame) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e9e9ec; color: var(--text); font-family: var(--font-sans); font-size: var(--fs-13); line-height: var(--lh-13); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss03"; }
html[data-theme="dark"] body { background: #050506; }
.toolbar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
.toolbar .name { font-weight: 600; margin-right: 8px; }
.stage { padding: 20px 16px 40px; }
.frame-wrap { width: 100%; max-width: 1440px; margin: 0 auto; }
.frame { width: var(--fw, 1440px); height: var(--fh, 900px); transform-origin: top left; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); background: var(--bg); position: relative; }
.frame.auto { height: auto; }
.caption { max-width: 1440px; margin: 0 auto 10px; color: var(--text-2); font-size: var(--fs-12); }
body.capture .toolbar, body.capture .caption { display: none; }
body.capture .stage { padding: 0; }
body.capture .frame { border-radius: 0; box-shadow: none; }

/* ---------- Kit ---------- */
.i { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
.i.s14 { width: 14px; height: 14px; }
.i.s20 { width: 20px; height: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h-md); padding: 0 12px; border-radius: var(--r-6); border: 1px solid transparent; font: 500 var(--fs-13)/1 var(--font-sans); color: var(--text); background: transparent; cursor: pointer; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .ibtn:focus-visible, .chip:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
.btn.xs { height: var(--h-xs); padding: 0 8px; font-size: var(--fs-12); border-radius: var(--r-4); gap: 4px; }
.btn.sm { height: var(--h-sm); padding: 0 10px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); }

.btn.secondary { background: var(--bg-subtle); border-color: var(--border); }

.btn.danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.ibtn { display: inline-grid; place-items: center; width: var(--h-sm); height: var(--h-sm); border-radius: var(--r-6); border: 0; background: transparent; color: var(--text-2); cursor: pointer; position: relative; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.ibtn:hover { background: var(--bg-subtle); color: var(--text); }
.ibtn.on { background: var(--select-bg); color: var(--select-fg); }
.ibtn.xs { width: var(--h-xs); height: var(--h-xs); border-radius: var(--r-4); }
.kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: var(--r-4); background: var(--kbd-bg); border: 1px solid var(--border-subtle); color: var(--text-3); font: 500 var(--fs-11)/1 var(--font-sans); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: var(--h-sm); padding: 0 8px; border-radius: var(--r-6); border: 0; background: transparent; color: var(--text-2); font: 500 var(--fs-12)/1 var(--font-sans); white-space: nowrap; flex: none; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.chip:hover, .chip.open { background: var(--bg-subtle); color: var(--text); }
.chip .i.caret { width: 14px; height: 14px; color: var(--text-3); }
.chip.toggle.on { color: var(--select-fg); background: var(--select-bg); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); line-height: 1; color: var(--text-2); white-space: nowrap; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.status.done .dot { background: var(--success-dot); } .status.done { color: var(--success); }
.status.wait .dot { background: var(--warning-dot); } .status.wait { color: var(--warning); }
.status.fail .dot { background: var(--danger-dot); } .status.fail { color: var(--danger); }
.status.run { color: var(--text-2); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--border-strong); border-top-color: var(--text-2); animation: spin 900ms linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.count { display: inline-flex; min-width: 18px; height: 18px; padding: 0 5px; align-items: center; justify-content: center; border-radius: var(--r-full); background: var(--bg-muted); color: var(--text-2); font: 500 var(--fs-11)/1 var(--font-sans); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }

.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.switch { width: 28px; height: 16px; border-radius: var(--r-full); background: var(--border-strong); position: relative; flex: none; cursor: pointer; transition: background-color var(--dur) var(--ease-out); border: 0; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease-out); }
.switch.on { background: var(--on); }
.switch.on::after { transform: translateX(12px); }
html[data-dir="a"][data-theme="dark"] .switch.on::after { background: #121214; }
.select { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: var(--h-sm); min-width: 160px; padding: 0 8px 0 10px; border-radius: var(--r-6); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: var(--fs-13); }
.input { display: flex; align-items: center; gap: 8px; height: var(--h-sm); padding: 0 10px; border-radius: var(--r-6); border: 1px solid var(--border); background: var(--bg); color: var(--text-3); }
.input.focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--focus); color: var(--text); }
.check { width: 16px; height: 16px; border-radius: var(--r-4); border: 1px solid var(--border-strong); display: grid; place-items: center; background: var(--bg); }
.check.on { background: var(--on); border-color: var(--on); color: var(--primary-fg); }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; }
.radio.on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--on); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-8); background: var(--bg-subtle); position: relative; }
.seg button { position: relative; z-index: 1; height: 24px; padding: 0 10px; border: 0; background: transparent; color: var(--text-2); border-radius: var(--r-6); font: 500 var(--fs-12)/1 var(--font-sans); cursor: pointer; transition: color var(--dur) var(--ease-out); }
.seg button.on { color: var(--text); }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; border-radius: var(--r-6); background: var(--bg); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border-subtle); transition: left var(--dur) var(--ease-out), width var(--dur) var(--ease-out); }
.menu { position: absolute; z-index: 30; min-width: 220px; padding: 4px; border-radius: var(--r-8); background: var(--bg-elevated); box-shadow: var(--shadow-md); transform-origin: var(--origin, bottom left); }
.menu .label { padding: 6px 8px 4px; color: var(--text-3); font-size: var(--fs-11); line-height: var(--lh-11); font-weight: 500; }
.menu .item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: var(--r-4); color: var(--text); cursor: default; }
.menu .item:hover, .menu .item.hl { background: var(--bg-subtle); }
.menu .item .body { flex: 1; min-width: 0; }
.menu .item .desc { color: var(--text-3); font-size: var(--fs-12); line-height: var(--lh-12); margin-top: 2px; }
.menu .item .tick { color: var(--text); margin-top: 2px; }
.menu .sep { height: 1px; margin: 4px; background: var(--border-subtle); }
.pop-enter { animation: pop var(--dur) var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(2px); } to { opacity: 1; transform: none; } }
.tooltip { position: absolute; z-index: 40; padding: 5px 8px; border-radius: var(--r-6); background: var(--tooltip-bg); color: var(--tooltip-fg); font-size: var(--fs-12); line-height: var(--lh-12); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tooltip .kbd { background: transparent; border-color: color-mix(in srgb, var(--tooltip-fg) 25%, transparent); color: color-mix(in srgb, var(--tooltip-fg) 70%, transparent); }
.collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out); opacity: 0; }
.collapse > div { overflow: hidden; }
.collapse.open { grid-template-rows: 1fr; opacity: 1; }
.caret-rot { transition: transform var(--dur) var(--ease-out); }
.is-open > .caret-rot, .open > .caret-rot { transform: rotate(90deg); }

/* ---------- Provider glyphs (brands, not icons) ---------- */
.pg { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: middle; }
.pg.s16 { width: 16px; height: 16px; } .pg.s20 { width: 20px; height: 20px; }
img.pg { object-fit: contain; }
.pg.claude { background: #d97757; -webkit-mask: url(assets/claude-mark.png) center / contain no-repeat; mask: url(assets/claude-mark.png) center / contain no-repeat; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--panel-current, 0px); grid-template-rows: minmax(0, 1fr); height: 100%; }
.app > * { min-height: 0; }
.app.panel-open > .panel { animation: panelIn var(--dur-slow) var(--ease-out); }
@keyframes panelIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.app.panel-open { --panel-current: var(--panel-w); }
.sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; min-width: 0; }
.side-top { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; }
.lights { display: flex; gap: 8px; width: 80px; flex: none; padding-left: 14px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-13); flex: 1; min-width: 0; }
.brand img { width: 16px; height: 16px; }
.side-search { margin: 4px 8px 6px; height: var(--h-sm); display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: var(--r-6); background: var(--bg-subtle); color: var(--text-3); cursor: text; transition: background-color var(--dur-fast) var(--ease-out); }
html[data-theme="dark"] .side-search { background: var(--bg-subtle); }
.side-search:hover { background: var(--bg-muted); }
.side-search .kbd { margin-left: auto; }
.nav { padding: 0 8px; display: flex; flex-direction: column; gap: 1px; }
.row { display: flex; align-items: center; gap: 8px; height: var(--h-sm); padding: 0 8px; border-radius: var(--r-6); color: var(--text); cursor: default; min-width: 0; transition: background-color var(--dur-fast) var(--ease-out); }
.row:hover { background: color-mix(in srgb, var(--bg-muted) 70%, transparent); }
.row.active { background: var(--select-bg); color: var(--select-fg); }
.row.active .time { color: inherit; opacity: .75; }
.row .i { color: var(--text-2); }
.row.active .i { color: inherit; }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { color: var(--text-3); font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
.row .unread { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
html[data-dir="a"] .row .unread { background: var(--info-dot); }
.side-scroll { flex: 1; overflow: hidden; padding: 6px 0; }
.sec { display: flex; align-items: center; gap: 4px; height: 24px; margin: 10px 8px 2px; padding: 0 8px; color: var(--text-3); font-size: var(--fs-12); font-weight: 500; }
.sec .i { width: 14px; height: 14px; }
.sec .grow { flex: 1; }
.proj { color: var(--text-2); }
.proj .i { color: var(--text-3); }
.indent { padding-left: 28px; }
.more { color: var(--text-3); font-size: var(--fs-12); }
.side-foot { height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-top: 1px solid var(--border-subtle); }
.side-foot .row { flex: 1; }

.main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); position: relative; }
.head { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border-subtle); }
.head .title { font-weight: 600; font-size: var(--fs-13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .grow { flex: 1; }
.head .group { display: flex; gap: 2px; }
.scroll { flex: 1; overflow: hidden; position: relative; }
.col { width: min(var(--reading), calc(100% - 48px)); margin: 0 auto; padding: 24px 0 16px; display: flex; flex-direction: column; gap: 16px; }
.bubble { align-self: flex-end; max-width: 80%; padding: 8px 12px; border-radius: var(--r-12); background: var(--bg-subtle); font-size: var(--fs-14); line-height: var(--lh-14); }
.reply { font-size: var(--fs-14); line-height: var(--lh-14); }
.reply p { margin: 0 0 8px; } .reply p:last-child { margin-bottom: 0; }
.worked { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); font-size: var(--fs-12); cursor: pointer; user-select: none; width: fit-content; border-radius: var(--r-4); padding: 2px 4px; margin-left: -4px; transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.worked:hover { color: var(--text-2); background: var(--bg-subtle); }
.worked .i { width: 14px; height: 14px; }
.tools { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 2px 2px; border-left: 1px solid var(--border); margin: 4px 0 4px 6px; padding-left: 12px; }
.tool { display: flex; align-items: center; gap: 8px; min-width: 0; height: 22px; color: var(--text-2); font-size: var(--fs-12); }
.tool .i { width: 14px; height: 14px; color: var(--text-3); }
.tool .verb { color: var(--text-3); }
.tool .name { color: var(--text); font-weight: 500; }
.tool .args { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.block { border: 1px solid var(--border); border-radius: var(--r-8); overflow: hidden; }
.block-head { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; color: var(--text-2); font-size: var(--fs-12); background: var(--bg-panel); border-bottom: 1px solid var(--border-subtle); }
.block-head .i { width: 14px; height: 14px; color: var(--text-3); }
.task { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 14px; align-items: center; gap: 4px 10px; padding: 8px 10px; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
.task + .task { border-top: 1px solid var(--border-subtle); }
.task:hover { background: var(--bg-subtle); }
.task .ttl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .sub { grid-column: 2 / 4; color: var(--text-2); font-size: var(--fs-12); line-height: var(--lh-12); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .meta { display: flex; align-items: center; gap: 10px; }
.task .dur { color: var(--text-3); font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
.task > .i { color: var(--text-3); width: 14px; height: 14px; }
.card { border: 1px solid var(--border); border-radius: var(--r-8); background: var(--bg); box-shadow: var(--shadow-sm); }
.approval { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.approval .top { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); }

.approval pre { margin: 0; padding: 8px 10px; border-radius: var(--r-6); background: var(--code-bg); border: 1px solid var(--border-subtle); font: 12px/18px var(--font-mono); color: var(--text); }
.approval .acts { display: flex; gap: 6px; }
.approval .acts .grow { flex: 1; }
.waiting { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: var(--fs-12); }

.composer-wrap { flex: none; padding: 0 0 16px; }
.composer { width: min(var(--reading), calc(100% - 48px)); margin: 0 auto; border: 1px solid var(--border); border-radius: var(--r-12); background: var(--bg); box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.composer.focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--focus); }
.composer .text { padding: 12px 14px 4px; min-height: 48px; font-size: var(--fs-14); line-height: var(--lh-14); color: var(--text-3); }
.composer .text.typed { color: var(--text); }
.composer .bar { display: flex; align-items: center; gap: 2px; padding: 6px 8px 8px; }
.composer .bar .grow { flex: 1; }
.send { width: 28px; height: 28px; border-radius: var(--r-full); border: 0; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); cursor: pointer; margin-left: 4px; transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.send:disabled { background: var(--bg-muted); color: var(--text-3); cursor: default; }
.send:active:not(:disabled) { transform: scale(.94); }
.send.stop { background: var(--text); color: var(--bg); }

.panel { background: var(--bg-panel); border-left: 1px solid var(--border-subtle); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.panel-inner { width: var(--panel-w); display: flex; flex-direction: column; height: 100%; }
.ph { height: 44px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border-subtle); }
.ph .ttl { font-weight: 600; font-size: var(--fs-13); }
.ph .grow { flex: 1; }
.ph.member { padding-left: 6px; gap: 8px; }
.ph .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.ph .who .n { font-weight: 600; font-size: var(--fs-13); line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .who .d { color: var(--text-3); font-size: var(--fs-11); line-height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agents { padding: 8px; display: flex; flex-direction: column; gap: 1px; }
.agent { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-6); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); position: relative; }
.agent:hover { background: var(--bg-subtle); }
.agent.active { background: var(--select-bg); }
.agent .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .sub { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: var(--fs-11); line-height: 14px; }
.agent .r { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
.agent .stop { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.agent:hover .stop, .agent.show-stop .stop { opacity: 1; }
.panel-body { flex: 1; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.taskcard { border: 1px solid var(--border); border-radius: var(--r-8); background: var(--bg); }
.taskcard .th { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; font-size: var(--fs-12); cursor: pointer; }
.taskcard .th b { font-weight: 600; }
.taskcard .th .p { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.taskcard .tb { padding: 0 10px 10px 30px; color: var(--text-2); font-size: var(--fs-12); line-height: 18px; }
.panel .composer { width: auto; margin: 0 12px; }
.panel .composer-wrap { padding-bottom: 12px; }
.panel .reply { font-size: var(--fs-13); line-height: 21px; }

/* New chat */
.newchat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding-bottom: 120px; }
.newchat h1 { margin: 0; font-size: var(--fs-20); line-height: var(--lh-20); font-weight: 600; letter-spacing: -.01em; }
.newchat .mark { width: 36px; height: 36px; }
.newchat .composer-wrap { width: min(var(--reading), calc(100% - 48px)); padding: 0; }
.newchat .composer { width: 100%; }
.send, .composer .bar > .ibtn { flex: none; }
.newchat .composer .text { min-height: 84px; }
.newchat .hint { color: var(--text-3); font-size: var(--fs-12); display: flex; gap: 16px; }

/* Settings */
.settings-nav .row .i { color: var(--text-2); }
.page { flex: 1; overflow: hidden; }
.page-in { width: 720px; margin: 0 auto; padding: 28px 0; display: flex; flex-direction: column; gap: 24px; }
.page h2 { margin: 0; font-size: var(--fs-20); line-height: var(--lh-20); font-weight: 600; letter-spacing: -.01em; }
.group-t { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.group-t h3 { margin: 0; font-size: var(--fs-13); font-weight: 600; }
.group { border: 1px solid var(--border); border-radius: var(--r-8); background: var(--bg); }
.srow { display: flex; align-items: center; gap: 16px; padding: 12px 14px; }
.srow + .srow { border-top: 1px solid var(--border-subtle); }
.srow .txt { flex: 1; min-width: 0; }
.srow .txt .n { font-weight: 500; }
.srow .txt .d { color: var(--text-3); font-size: var(--fs-12); line-height: 18px; margin-top: 1px; }
.tile { width: 28px; height: 28px; border-radius: var(--r-6); border: 1px solid var(--border-subtle); background: var(--bg-subtle); display: grid; place-items: center; flex: none; }

/* Provider glyph with a state dot (the only state mark in a row) */
.gd { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none; }
.gd .sd { position: absolute; right: -2px; bottom: -2px; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 2px var(--dot-ring, var(--bg-panel)); }
.gd .sd.run { background: var(--primary); animation: pulse 1.6s var(--ease-in-out) infinite; }
html[data-dir="a"] .gd .sd.run { background: var(--info-dot); }
.gd .sd.wait { background: var(--warning-dot); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.shimmer { background: linear-gradient(90deg, var(--text-3) 0%, var(--text-3) 40%, var(--text) 50%, var(--text-3) 60%, var(--text-3) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shimmer 1.8s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.working { display: flex; flex-direction: column; gap: 6px; }
.working .wl { color: var(--text-3); font-size: var(--fs-12); padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }
.step { display: flex; align-items: center; gap: 8px; height: 22px; color: var(--text-3); font-size: var(--fs-12); min-width: 0; }
.step .i { width: 14px; height: 14px; }
.step span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: var(--r-6); cursor: pointer; --dot-ring: var(--bg); transition: background-color var(--dur-fast) var(--ease-out); }
.trow:hover { background: var(--bg-subtle); --dot-ring: var(--bg-subtle); }
.trow .ttl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tm { color: var(--text-3); font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
.trow .sub { grid-column: 2 / 4; color: var(--text-2); font-size: var(--fs-12); line-height: var(--lh-12); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-sec { padding: 8px; border-bottom: 1px solid var(--border-subtle); }
.side-sec:last-child { border-bottom: 0; }
.side-label { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; color: var(--text-3); font-size: var(--fs-12); font-weight: 500; }
.side-label .grow { flex: 1; }
.arow { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: var(--r-6); cursor: pointer; position: relative; transition: background-color var(--dur-fast) var(--ease-out); }
.arow:hover, .arow.hover { background: var(--bg-subtle); --dot-ring: var(--bg-subtle); }
.arow .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .tm { color: var(--text-3); font-size: var(--fs-11); font-variant-numeric: tabular-nums; min-width: 24px; text-align: right; }
.arow .stopq { display: none; width: var(--h-xs); height: var(--h-xs); border-radius: var(--r-4); place-items: center; color: var(--text-2); }
.arow.running:hover .tm, .arow.running.hover .tm { display: none; }
.arow.running:hover .stopq, .arow.running.hover .stopq { display: grid; }
.arow .stopq:hover { background: var(--bg-muted); color: var(--text); }
.arow .stopq .sq, .stopq .sq { width: 8px; height: 8px; border-radius: var(--r-4); background: currentColor; }
.arow .stopq { border: 0; background: transparent; cursor: pointer; padding: 0; }
.arow.dim .n { color: var(--text-2); }
.hovercard { position: absolute; z-index: 35; width: 280px; padding: 10px 12px; border-radius: var(--r-8); background: var(--bg-elevated); box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-12); line-height: 18px; }
.hovercard .t { font-size: var(--fs-13); font-weight: 600; color: var(--text); }
.hovercard .m { color: var(--text-2); }
.hovercard .s { color: var(--text-3); }
.hovercard .now { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--border-subtle); color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.ibtn .badge { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: var(--r-full); background: var(--primary); color: var(--primary-fg); font: 600 var(--fs-11)/14px var(--font-sans); text-align: center; }
html[data-dir="a"] .ibtn .badge { background: var(--text); color: var(--bg); }
.dock { flex: none; height: 230px; border-top: 1px solid var(--border); background: var(--bg-panel); display: flex; flex-direction: column; }
.dock-tabs { height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--border-subtle); }
.dock-tab { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-4); font-size: var(--fs-12); color: var(--text-2); }
.dock-tab.on { background: var(--bg-subtle); color: var(--text); }
.dock pre { margin: 0; padding: 8px 12px; font: 12px/18px var(--font-mono); color: var(--text-2); }
.dock pre b { color: var(--success); font-weight: 500; }
.art-list { padding: 8px; display: flex; flex-direction: column; gap: 1px; }
.art { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-6); }
.art:hover, .art.active { background: var(--bg-subtle); }
.art .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.art .sub { grid-column: 2 / 4; color: var(--text-3); font-size: var(--fs-11); line-height: 14px; }
.art .i { color: var(--text-3); }
.doc { padding: 14px 16px; font-size: var(--fs-13); line-height: 21px; }
.doc h6 { margin: 0 0 6px; font-size: var(--fs-14); font-weight: 600; }
.doc ul { margin: 6px 0 10px; padding-left: 18px; }
.doc li { margin: 2px 0; }
.doc ins { text-decoration: none; background: color-mix(in srgb, var(--success-dot) 16%, transparent); border-radius: var(--r-4); padding: 0 2px; }
.doc del { color: var(--text-3); background: color-mix(in srgb, var(--danger-dot) 12%, transparent); border-radius: var(--r-4); padding: 0 2px; }
.doc-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); }
.doc-bar .grow { flex: 1; }

.tools .tool .name { font-weight: 400; color: var(--text-3); }
.deleg { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 2px; }
.deleg-sum { display: flex; align-items: center; gap: 8px; height: 22px; color: var(--text-3); font-size: var(--fs-12); }
.deleg-sum .i { width: 14px; height: 14px; }
.trow { grid-template-columns: 16px minmax(0, 1fr) auto 14px; }
.trow .sub { grid-column: 2 / 4; }
.trow > .i { color: var(--text-3); width: 14px; height: 14px; }
.opts { display: flex; flex-direction: column; gap: 2px; }
.opt { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: var(--r-6); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
.opt:hover { background: var(--bg-subtle); }
.opt.sel { background: var(--select-bg); color: var(--select-fg); }
.opt .num { color: var(--text-3); font-variant-numeric: tabular-nums; width: 14px; }
.opt.sel .num { color: inherit; }
.opt .k { margin-left: auto; }
.approval .foot { display: flex; align-items: center; gap: 8px; }
.approval .foot .grow { flex: 1; }
.strip { width: min(var(--reading), calc(100% - 48px)); margin: 0 auto 8px; display: flex; align-items: center; gap: 4px; }
.strip .arow { flex: 1; border: 1px solid var(--border); background: var(--bg); }
.arow .kind { color: var(--text-3); }
.arow .st { color: var(--text-3); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
.app.has-dock { grid-template-rows: minmax(0, 1fr) 220px; }
.app.has-dock > .sidebar { grid-row: 1 / 3; }
.app.has-dock > .dock { grid-column: 2 / 4; grid-row: 2; height: auto; position: relative; }
.dock .grip { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; }
.dock .grip::after { content: ""; position: absolute; left: 50%; top: 2px; width: 32px; height: 2px; margin-left: -16px; border-radius: var(--r-full); background: var(--border-strong); }
.ph .wst { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: var(--fs-12); white-space: nowrap; }
.ph .wst .el { color: var(--text-3); font-variant-numeric: tabular-nums; }
.ibtn.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.side-foot2 { margin-top: auto; }

/* Kit sheet */
.kit { padding: 32px 40px 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; background: var(--bg); }
.kit .cell { border: 1px solid var(--border); border-radius: var(--r-8); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.kit .cell.wide { grid-column: span 2; }
.kit .cell.full { grid-column: 1 / -1; }
.kit h4 { margin: 0; font-size: var(--fs-12); color: var(--text-3); font-weight: 500; }
.kit .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.kit .typerow { display: flex; align-items: baseline; gap: 16px; }
.kit .typerow .k { width: 90px; color: var(--text-3); font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
.kit .icons { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; color: var(--text-2); }
.kit .icons div { display: grid; place-items: center; height: 32px; border-radius: var(--r-6); }
.kit .icons div:hover { background: var(--bg-subtle); color: var(--text); }
.dialog { width: 400px; border-radius: var(--r-12); background: var(--bg-elevated); box-shadow: var(--shadow-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dialog h5 { margin: 0; font-size: var(--fs-14); font-weight: 600; }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-8); background: var(--bg-elevated); box-shadow: var(--shadow-md); width: 340px; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.sw { height: 44px; border-radius: var(--r-6); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; padding: 4px 6px; font-size: var(--fs-11); color: var(--text-3); }
</style>

<script>
const params = new URLSearchParams(location.hash.slice(1));
const state = { screen: params.get("screen") || "sessions", theme: params.get("theme") || "light", dir: params.get("dir") || "b", icons: params.get("icons") || "phosphor" };
const capture = !!params.get("capture");
if (capture) document.body.classList.add("capture");

const MARK = "assets/accordagents-mark.png";
const AGY = "assets/antigravity-logo.png";
const icon = (name, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#${state.icons === "lucide" ? "l" : "i"}-${name}"/></svg>`;
const codex = (s = "") => `<svg class="pg ${s}" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="cg" x1="12" x2="12" y1="0" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#b1a7ff"/><stop offset=".5" stop-color="#7a9dff"/><stop offset="1" stop-color="#3941ff"/></linearGradient></defs><path fill="url(#cg)" fill-rule="evenodd" d="M8.086.457a6.105 6.105 0 013.046-.415c1.333.153 2.521.72 3.564 1.7a.117.117 0 00.107.029c1.408-.346 2.762-.224 4.061.366l.063.03.154.076c1.357.703 2.33 1.77 2.918 3.198.278.679.418 1.388.421 2.126a5.655 5.655 0 01-.18 1.631.167.167 0 00.04.155 5.982 5.982 0 011.578 2.891c.385 1.901-.01 3.615-1.183 5.14l-.182.22a6.063 6.063 0 01-2.934 1.851.162.162 0 00-.108.102c-.255.736-.511 1.364-.987 1.992-1.199 1.582-2.962 2.462-4.948 2.451-1.583-.008-2.986-.587-4.21-1.736a.145.145 0 00-.14-.032c-.518.167-1.04.191-1.604.185a5.924 5.924 0 01-2.595-.622 6.058 6.058 0 01-2.146-1.781c-.203-.269-.404-.522-.551-.821a7.74 7.74 0 01-.495-1.283 6.11 6.11 0 01-.017-3.064.166.166 0 00.008-.074.115.115 0 00-.037-.064 5.958 5.958 0 01-1.38-2.202 5.196 5.196 0 01-.333-1.589 6.915 6.915 0 01.188-2.132c.45-1.484 1.309-2.648 2.577-3.493.282-.188.55-.334.802-.438.286-.12.573-.22.861-.304a.129.129 0 00.087-.087A6.016 6.016 0 015.635 2.31C6.315 1.464 7.132.846 8.086.457zm-.804 7.85a.848.848 0 00-1.473.842l1.694 2.965-1.688 2.848a.849.849 0 001.46.864l1.94-3.272a.849.849 0 00.007-.854l-1.94-3.393zm5.446 6.24a.849.849 0 000 1.695h4.848a.849.849 0 000-1.696h-4.848z"/></svg>`;
/** The app's own Claude mark (claude-avatar.png as a mask in the brand color), as chat-sessions.css draws it. */
const claude = (s = "") => `<span class="pg claude ${s}" aria-hidden="true"></span>`;
const agy = (s = "") => `<img class="pg ${s}" src="${AGY}" alt="">`;
const G = { codex, claude, agy };
/** Bare provider glyph with the row's only state mark: a dot while the state matters. */
const gd = (kind, st) => `<span class="gd">${G[kind]("s16")}${st ? `<span class="sd ${st}"></span>` : ""}</span>`;
const isDark = () => document.documentElement.dataset.theme === "dark";

/* ---------- Shell ---------- */
function sidebar({ active = "chat", settings = false } = {}) {
  const top = `<div class="side-top" data-titlebar><div class="lights"><span></span><span></span><span></span></div><div class="brand"><img src="${MARK}" alt="">AccordAgents</div><button class="ibtn" aria-label="Hide sidebar">${icon("sidebar-simple")}</button></div>`;
  const foot = (left) => `<div class="side-foot">${left}<button class="ibtn" aria-label="Theme">${icon(isDark() ? "sun" : "moon")}</button><button class="ibtn" aria-label="Refresh">${icon("arrows-clockwise")}</button></div>`;
  if (settings) {
    const items = [["sliders-horizontal", "General", true], ["cloud", "AWS"], ["key", "Environment"], ["clock", "Scheduled Tasks"], ["bell-ringing", "Alerts"], ["users", "Roles"], ["list-checks", "Rules"], ["chat-text", "Prompts"], ["plug", "Plugins & Skills"], ["brain", "Memory"], ["users", "Members"]];
    return `<aside class="sidebar settings-nav">${top}
      <div class="nav"><div class="row">${icon("arrow-left")}<span class="t">Chats</span></div></div>
      <div class="sec">Settings</div>
      <div class="nav">${items.map(([ic, t, on]) => `<div class="row ${on ? "active" : ""}">${icon(ic)}<span class="t">${t}</span></div>`).join("")}</div>
      <div style="flex:1"></div>${foot(`<div style="flex:1"></div>`)}</aside>`;
  }
  const chat = (t, time, o = {}) => `<div class="row ${o.indent ? "indent" : ""} ${o.active ? "active" : ""}">${o.run ? `<span class="spin"></span>` : ""}<span class="t">${t}</span>${o.unread ? `<span class="unread"></span>` : ""}<span class="time">${time}</span></div>`;

/* One composer presentation for the main session, a member and New chat.
   running: the main session's own turn runs. density: "full", "partial" (effort and mode as icons), "icons" (everything but the model). */
function composer({ placeholder = "Ask anything. / commands, # files", typed = "", focus = false, member = "", running = false, newChat = false, density = "full", machine = false, effort = "Extra High" } = {}) {
  const asIcon = density !== "full";
  const chip = (inner, label, menu = "") => `<button class="chip" ${menu} aria-label="${label}">${inner}${icon("caret-down", "caret")}</button>`;
  const model = member === "claude" ? chip(`${claude()}Opus 5.5`, "Model: Opus 5.5") : chip(`${codex()}GPT-6.2-Astra`, "Model: GPT-6.2-Astra", `data-menu="model"`);
  const eff = asIcon ? chip(icon("gauge", "s14"), `Effort: ${effort}`) : chip(effort, `Effort: ${effort}`);
  const modeLabel = member === "claude" ? "Manual" : "Ask for approval";
  const mode = asIcon ? chip(icon("lock-simple", "s14"), `Mode: ${modeLabel}`) : chip(`${icon("lock-simple", "s14")}${modeLabel}`, `Mode: ${modeLabel}`);
  const plan = member === "claude" ? "" : `<button class="chip toggle" aria-label="Plan mode">${icon("clipboard-text", "s14")}${density === "icons" ? "" : "Plan mode"}</button>`;
  const where = machine ? (density === "icons" ? chip(icon("desktop", "s14"), "Runs on: Local") : chip(`${icon("desktop", "s14")}Local`, "Runs on: Local")) : "";
  // Main session running and nothing typed: Send becomes Stop. Typed: a secondary Stop beside Send.
  const send = running && !typed
    ? `<button class="send stop" aria-label="Stop">${icon("square", "s14")}</button>`
    : `${running ? `<button class="ibtn" aria-label="Stop">${icon("stop-circle")}</button>` : ""}<button class="send" ${typed ? "" : "disabled"} aria-label="Send">${icon("arrow-up", "s14")}</button>`;
  const leading = newChat
    ? `<button class="ibtn" aria-label="Attach image">${icon("image")}</button><button class="chip">${icon("folder-simple", "s14")}demo-project${icon("caret-down", "caret")}</button>`
    : `<button class="ibtn" aria-label="Attach image">${icon("image")}</button>${member ? "" : `<button class="ibtn" aria-label="Start an Accord">${icon("git-merge")}</button>`}`;
  return `<div class="composer-wrap"><div class="composer ${focus ? "focus" : ""}">
    <div class="text ${typed ? "typed" : ""}">${typed || placeholder}</div>
    <div class="bar">${leading}<span class="grow"></span>${where}${model}${eff}${mode}${plan}${send}</div>
  </div></div>`;
}

/* ---------- Rendering and interactions ---------- */
function placeThumb(seg) {
  const on = seg.querySelector("button.on"); const th = seg.querySelector(".thumb");
  if (on && th) { th.style.left = on.offsetLeft + "px"; th.style.width = on.offsetWidth + "px"; }
}
function render() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.dir = state.dir;
  for (const seg of document.querySelectorAll(".toolbar .seg")) {
    for (const b of seg.querySelectorAll("button")) b.classList.toggle("on", b.dataset.v === state[seg.dataset.seg]);
    placeThumb(seg);
  }
  const s = SCREENS[state.screen] || SCREENS.sessions;
  const frame = document.getElementById("frame");
  const [w, h] = s.size || [1440, 900];
  frame.style.setProperty("--fw", w + "px");
  frame.style.setProperty("--fh", s.auto ? "auto" : h + "px");
  frame.classList.toggle("auto", !!s.auto);
  frame.innerHTML = s.html();
  document.getElementById("caption").textContent = s.cap + (state.dir === "a" ? " Направление A, графит." : " Направление B, фирменный.") + (state.icons === "lucide" ? " Иконки Lucide." : " Иконки Phosphor.");
  for (const seg of frame.querySelectorAll(".seg")) placeThumb(seg);
  for (const sc of frame.querySelectorAll(".scroll")) sc.scrollTop = sc.scrollHeight;
  fit();
  history.replaceState(null, "", "#" + new URLSearchParams({ screen: state.screen, theme: state.theme, dir: state.dir, icons: state.icons }).toString() + (capture ? "&capture=1" : ""));
}
function fit() {
  const wrap = document.getElementById("wrap"); const frame = document.getElementById("frame");
  if (capture) { frame.style.transform = ""; wrap.style.height = ""; return; }
  const w = parseFloat(getComputedStyle(frame).width);
  const k = Math.min(1, wrap.clientWidth / w);
  frame.style.transform = `scale(${k})`;
  wrap.style.height = frame.offsetHeight * k + "px";
}
document.querySelector(".toolbar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); const seg = b && b.closest(".seg");
  if (!b || !seg) return; state[seg.dataset.seg] = b.dataset.v; state.member = null; state.artifactList = false; render();
});
document.getElementById("frame").addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle]");
  if (t) { const host = t.parentElement; host.classList.toggle("is-open"); t.classList.toggle("open"); host.querySelector(".collapse").classList.toggle("open"); return; }
  if (e.target.closest(".stopq")) return;
  const om = e.target.closest("[data-open-member]");
  if (om) { state.member = om.dataset.openMember; state.screen = "member"; render(); return; }
  if (e.target.closest("[data-back]")) { state.screen = "sessions"; render(); return; }
  if (e.target.closest("[data-back-artifacts]")) { state.artifactList = true; render(); return; }
  if (e.target.closest("[data-open-artifact]")) { state.artifactList = false; render(); return; }
  if (e.target.closest("[data-close-panel]")) { document.querySelector("[data-app]").classList.remove("panel-open"); document.querySelectorAll("[data-panel]").forEach((x) => { if (x.dataset.panel !== "terminal") x.classList.remove("on"); }); return; }
  const pb = e.target.closest("[data-panel]");
  if (pb) {
    const id = pb.dataset.panel;
    if (id === "terminal") { pb.classList.toggle("on"); return; }
    if (pb.classList.contains("on")) { document.querySelector("[data-app]").classList.remove("panel-open"); pb.classList.remove("on"); return; }
    state.screen = id === "artifacts" ? "artifacts" : "sessions"; state.artifactList = id === "artifacts"; render(); return;
  }
  const seg = e.target.closest(".frame .seg button");
  if (seg) { seg.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === seg)); placeThumb(seg.parentElement); }
});
window.addEventListener("resize", fit);
document.fonts.ready.then(render);
render();
