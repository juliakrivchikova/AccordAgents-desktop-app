<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urgent alert variants</title>
<!-- The app's real tokens (light in :root, dark in .dark) and the real
     chat-urgent-alert.css, which draws the current card and the folded row
     every variant shares. Nothing else from the app is loaded. -->
<link rel="stylesheet" href="../../../src/renderer/styles/app-theme.css">
<link rel="stylesheet" href="../../../src/renderer/styles/views/chat-urgent-alert.css">
<style>
@font-face {
  font-family: "Inter Variable";
  font-style: normal;
  font-display: block;
  font-weight: 100 900;
  src: url("../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2-variations");
}

/* app-theme.css locks html and body to the window; a mockup page scrolls. */
html, body { height: auto; min-height: 100%; overflow: visible; }
body {
  margin: 0;
  padding: 32px;
  background: var(--ui-bg-sidebar);
  color: var(--ui-text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 20px;
}
html.dark body { background: var(--ui-bg-sidebar); }
p, h1, h2, h3 { margin: 0; }
button { font-family: inherit; }

/* ---------- page chrome (not part of the design) ---------- */
.page-head { max-width: 1560px; margin-bottom: 28px; }
.page-head h1 { font-size: 16px; line-height: 24px; font-weight: 600; }
.page-head p { margin-top: 4px; color: var(--ui-text-2); max-width: 980px; }
.variant { margin-bottom: 44px; }
.variant-head { max-width: 1560px; margin-bottom: 12px; }
.variant-head h2 { font-size: 14px; line-height: 22px; font-weight: 600; }
.variant-head .why { margin-top: 2px; color: var(--ui-text); max-width: 1100px; }
.variant-head .uses { margin-top: 2px; color: var(--ui-text-3); font-size: 12px; line-height: 18px; max-width: 1100px; }
.themes { display: flex; gap: 24px; align-items: flex-start; }
.theme-col { flex: none; }
.theme-name { margin: 0 0 6px 2px; color: var(--ui-text-3); font-size: 12px; line-height: 16px; }

/* One chat pane: the reading column of the chat (768px, --ui-reading-width). */
.pane {
  width: 768px;
  padding: 22px 24px 20px;
  border: 1px solid var(--ui-border);
  border-radius: var(--ui-radius-12);
  background: var(--ui-bg);
  color: var(--ui-text);
}
.state-label {
  margin: 18px -24px 10px;
  padding: 10px 24px 0 74px;
  border-top: 1px solid var(--ui-border-subtle);
  color: var(--ui-text-3);
  font-size: 11px;
  line-height: 16px;
}

/* ---------- an ordinary chat message (messages.css proportions) ---------- */
.msg { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; margin-bottom: 14px; }
.avatar {
  display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: 8px;
  background: var(--brand-anthropic-soft); color: var(--brand-anthropic);
}
.msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; line-height: 1.25; min-width: 0; }
.msg-meta strong { font-size: 14px; font-weight: 600; color: var(--ui-text); }
.msg-provider, .msg-when { color: var(--ui-text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.msg-text { font-size: 14px; line-height: 22px; color: var(--ui-text); overflow-wrap: anywhere; }
.mini-avatar {
  display: grid; place-items: center; flex: none;
  width: 20px; height: 20px; border-radius: 6px;
  background: var(--brand-anthropic-soft); color: var(--brand-anthropic);
}

/* The slot every card sits in: the messages' text column (past the 38px
   avatar and 12px gap), at most 624px, as .chat-urgent-alert places it. */
.alert-slot { margin-left: 50px; max-width: 624px; padding: 4px 0; }

/* ---------- kit pieces, as the kit draws them ---------- */
/* Button size="sm": h-7, px-2.5, text-ui-13 medium, rounded-ui-8. */
.k-btn {
  display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px;
  height: var(--ui-control-sm); padding: 0 10px;
  border: 1px solid transparent; border-radius: var(--ui-radius-8);
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap; cursor: pointer;
}
.k-btn.primary { background: var(--ui-primary); color: var(--ui-primary-fg); }
.k-btn.outline { border-color: var(--ui-border); background: var(--ui-bg); color: var(--ui-text); }
/* IconButton size="xs": 24px, 14px glyph, text-2, no border or fill at rest. */
.k-icon-btn {
  display: inline-grid; flex: none; place-items: center;
  width: var(--ui-control-xs); height: var(--ui-control-xs);
  border: 0; border-radius: var(--ui-radius-8); padding: 0;
  background: transparent; color: var(--ui-text-2); cursor: pointer;
}

/* ---------- quiet status: a small dot and colored words ---------- */
.tone-now, .tone-bad { --tone: var(--ui-danger); --tone-dot: var(--ui-danger-dot); }
.tone-off { --tone: var(--ui-warning); --tone-dot: var(--ui-warning-dot); }
.tone-done { --tone: var(--ui-success); --tone-dot: var(--ui-success-dot); }
.dot { flex: none; width: 6px; height: 6px; border-radius: 999px; background: var(--tone-dot); }
.st-main { color: var(--tone); font-size: 13px; font-weight: 500; line-height: 20px; font-variant-numeric: tabular-nums; }
.st-main b { font-weight: 600; }
.st-detail { color: var(--ui-text-3); font-size: 12px; line-height: 18px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.st-error { margin-top: 2px; color: var(--ui-danger); font-size: 12px; line-height: 18px; overflow-wrap: anywhere; }
.st-words { flex: 1; min-width: 0; }

/* ---------- Variant 1: kit card on the approved anatomy ---------- */
.v1 {
  padding: 10px 12px 12px;
  border: 1px solid var(--ui-border);
  border-radius: var(--ui-radius-8);
  background: var(--ui-bg);
  box-shadow: var(--ui-shadow-sm);
}
.v1.is-awaiting { border-color: color-mix(in srgb, var(--ui-danger) 45%, var(--ui-border)); }
.v1-head { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.v1-bell { flex: none; color: var(--ui-text-3); }
.v1.is-awaiting .v1-bell { color: var(--ui-danger); }
.v1-title { font-size: 13px; font-weight: 600; color: var(--ui-text); }
.v1-who { color: var(--ui-text-2); font-size: 12px; font-weight: 500; }
.v1-when { margin-left: auto; color: var(--ui-text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.v1-head .k-icon-btn { margin-right: -6px; }
.v1-text { margin-top: 6px; font-size: 14px; line-height: 22px; color: var(--ui-text); overflow-wrap: anywhere; }
.v1-status {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--ui-border-subtle);
}
.v1-status .dot { align-self: flex-start; margin-top: 7px; }

/* ---------- Variant 2: the compaction card's sibling ---------- */
.v2-who { display: flex; align-items: center; gap: 6px; margin: 0 0 6px 2px; color: var(--ui-text-2); font-size: 12px; font-weight: 500; }
.v2-who .msg-when { font-size: 12px; font-weight: 400; }
.v2-panel {
  padding: 12px;
  border: 1px solid var(--ui-border);
  border-radius: var(--ui-radius-8);
  background: var(--ui-bg);
  box-shadow: var(--ui-shadow-sm);
}
.v2-top { display: flex; align-items: flex-start; gap: 12px; }
.v2-tile {
  display: grid; flex: none; place-items: center;
  width: 30px; height: 30px; margin-top: 1px;
  border-radius: var(--ui-radius-8);
  background: var(--ui-bg-subtle); color: var(--ui-text-2);
}
.v2.is-awaiting .v2-tile { background: color-mix(in srgb, var(--ui-danger) 12%, var(--ui-bg)); color: var(--ui-danger); }
.v2-text { flex: 1; min-width: 0; }
.v2-title { color: var(--ui-text); font-size: 13px; font-weight: 600; line-height: 22px; }
.v2-desc { margin-top: 3px; color: var(--ui-text); font-size: 13px; line-height: 21px; overflow-wrap: anywhere; }
.v2-top .k-icon-btn { margin: 0 -4px 0 0; }
.v2-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-left: 42px; }
.v2-foot .dot { align-self: flex-start; margin-top: 7px; }

/* ---------- Variant 3: the member's message with a status strip ---------- */
.v3-flag { display: inline-flex; align-items: center; gap: 4px; align-self: center; color: var(--ui-text-3); font-size: 12px; font-weight: 500; }
.v3.is-awaiting .v3-flag { color: var(--ui-danger); }
.v3-strip {
  display: flex; align-items: center; gap: 8px;
  max-width: 624px; margin-top: 10px;
  padding: 7px 8px 7px 12px;
  border: 1px solid var(--ui-border);
  border-radius: var(--ui-radius-8);
  background: var(--ui-bg);
  box-shadow: var(--ui-shadow-sm);
}
.v3.is-awaiting .v3-strip { border-color: color-mix(in srgb, var(--ui-danger) 45%, var(--ui-border)); }
.v3-strip .dot { align-self: flex-start; margin-top: 7px; }

/* ---------- Variant 4: the kit Notice (Alert), tone by state ---------- */
.v4 {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 8px;
  padding: 8px 8px 10px 10px;
  border: 1px solid var(--ui-border);
  border-radius: var(--ui-radius-8);
  background: var(--ui-bg-elevated);
}
.v4.is-error { border-color: color-mix(in srgb, var(--app-danger) 30%, transparent); background: var(--app-danger-soft); }
.v4-icon { margin-top: 4px; color: var(--ui-text-3); }
.v4.is-error .v4-icon { color: var(--app-danger); }
.v4.is-warning .v4-icon { color: var(--app-warning); }
.v4.is-done .v4-icon { color: var(--ui-success); }
.v4-body { min-width: 0; padding-top: 2px; }
.v4-title { display: flex; align-items: baseline; gap: 8px; color: var(--ui-text); font-size: 13px; font-weight: 500; line-height: 20px; }
.v4-title .msg-when { font-size: 12px; font-weight: 400; }
.v4-desc { margin-top: 2px; color: var(--ui-text); font-size: 13px; line-height: 20px; overflow-wrap: anywhere; }
.v4-status { margin-top: 8px; }
.v4-status .st-main { color: var(--ui-text); }
.v4-action { display: flex; align-self: start; align-items: center; gap: 4px; }

/* ---------- the current card: real CSS, the button as the code draws it ---------- */
.cur-btn {
  display: inline-flex; flex: none; align-items: center; height: 32px; padding: 0 15px;
  border: 1px solid transparent; border-radius: var(--ui-radius-8);
  background: var(--ui-primary); color: var(--ui-primary-fg);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chat-urgent-alert-head svg, .chat-urgent-alert-status svg { flex: none; }

/* ---------- shots ---------- */
body.is-shot { padding: 24px; }
#shot { display: inline-block; }
#shot > .variant:last-child, #shot > section:last-child { margin-bottom: 0; }
</style>
</head>

const mainLine = (s) => `${s.lead}${s.countdown ? `<b>${s.countdown}</b>` : ""}${s.tail ?? ""}`;
const words = (s) => `<div class="st-words"><div class="st-main">${mainLine(s)}</div>` +
  (s.detail ? `<div class="st-detail">${s.detail}</div>` : "") +
  (s.error ? `<div class="st-error">${s.error}</div>` : "") + `</div>`;
const actionButton = (s) => s.action === "got-it" ? `<button class="k-btn primary">Got it</button>`
  : s.action === "set-up" ? `<button class="k-btn outline">Set up alerts</button>` : "";
const closeButton = (s) => s.closable ? `<button class="k-icon-btn" aria-label="Close alert">${icon("X", 14)}</button>` : "";

        <div class="v4-status">${words(s)}</div>
      </div>
      <div class="v4-action">${actionButton(s)}${closeButton(s)}</div>
    </div>
  </div>`;

/* The card on beta today: the real classes and CSS, the waiting state. */
const CURRENT = () => `
  <article class="chat-urgent-alert">
    <div class="chat-urgent-alert-panel">
      <div class="chat-urgent-alert-head">
        ${icon("BellRinging", 18, "chat-urgent-alert-bell")}
        <span class="chat-urgent-alert-title">Urgent alert</span>
      </div>
      <div class="chat-urgent-alert-from">${WHO} &middot; ${AT}</div>
      <div class="chat-urgent-alert-text">${MESSAGE}</div>
      <div class="chat-urgent-alert-status is-now">
        ${icon("Clock", 16, "chat-urgent-alert-status-icon")}
        <div class="chat-urgent-alert-status-words">
          <div class="chat-urgent-alert-status-main">Calling you in <strong class="chat-urgent-alert-countdown">0:49</strong></div>
          <div class="chat-urgent-alert-status-detail">Sent to Telegram. Got it here or there stops the call.</div>
        </div>
        <button class="cur-btn">Got it</button>
      </div>
    </div>
  </article>`;

const VARIANTS = [
  { id: "v1", name: "Variant 1: kit card on the approved anatomy", render: V1,
    why: "Keeps the approved order (header, message, what happens now, one action) but drops the red fill and the grey band: a plain kit card, a red bell, a red-tinted edge only while it waits for you, and the status as a dot with colored words.",
    uses: "Card shell of .chat-app-tool-approval-panel (--ui-bg, --ui-border, --ui-radius-8, --ui-shadow-sm, 12px padding), a --ui-border-subtle divider, Button sm primary and outline, IconButton xs (X), BellRinging 16, --ui-danger / --ui-warning / --ui-success with their -dot tokens." },
  { id: "v2", name: "Variant 2: the compaction card's sibling", render: V2,
    why: "The anatomy of the compaction card approved on 2026-11-22: who and when on a small line above, an icon tile, the title and the message, then status and action in the foot. Red lives only in the tile and the dot.",
    uses: ".chat-compaction-card proportions (who line 12px with a 20px avatar, 30px icon tile at --ui-radius-8, title 13/600, text 13/21, foot indented 42px), Button sm, IconButton xs, the tile tinted with color-mix of --ui-danger over --ui-bg." },
  { id: "v3", name: "Variant 3: the member's message with a status strip", render: V3,
    why: "The alert is the member's own message (avatar, name, a red Urgent alert flag, the text at chat size), and only the live part (status, countdown, Got it) is a small bordered strip under it. The most compact, and the closest to the chat around it.",
    uses: "The chat message grid (38px avatar, 12px gap, 14/22 text), a strip with the card shell (--ui-border, --ui-radius-8, --ui-shadow-sm) tinted at the edge while it waits, Button sm, IconButton xs, BellRinging 12 in the meta row." },
  { id: "v4", name: "Variant 4: the kit Notice, tone by state", render: V4,
    why: "Built on the kit Notice (Alert): the danger tint while it needs you, a plain card otherwise (an amber icon when it never left the app, a green one once you got it). The state reads from the color before a word, but it is the loudest of the four.",
    uses: "Notice tones as primitives/notice.tsx draws them (error: --app-danger-soft with --app-danger at 30% for the edge; otherwise the plain Alert on --ui-bg-elevated and --ui-border), a 16px state icon (BellRinging, PhoneX, BellSlash, CheckCircle), the action column of AlertAction, Button sm, IconButton xs." }
];

const pane = (inner) => `<div class="pane">${inner}</div>`;

const statesPane = (variant) => {
  let html = ordinaryMessage();
  STATES.forEach((s, index) => {
    if (index > 0) html += `<div class="state-label">${s.label}</div>`;
    else html += `<div class="state-label" style="border-top:0;margin-top:0;padding-top:0">${s.label}</div>`;
    html += s.folded ? foldedRows() : variant.render(s);
  });
  return pane(html);
};

const themeCol = (theme, inner) =>
  `<div class="theme-col${theme === "dark" ? " dark" : ""}"><div class="theme-name">${theme === "dark" ? "Dark" : "Light"}</div>${inner}</div>`;

const variantHead = (v) => `<header class="variant-head"><h2>${v.name}</h2><p class="why">${v.why}</p><p class="uses">${v.uses}</p></header>`;

const currentSection = () => `
  <section class="variant" id="current">
    <header class="variant-head"><h2>Current card (beta)</h2>
      <p class="why">For comparison: the solid red header, the who line, the message in 13/600, the grey status band and a 32px Got it, drawn with the real chat-urgent-alert.css.</p></header>
    <div class="themes">
      ${themeCol("light", pane(ordinaryMessage() + CURRENT()))}
      ${themeCol("dark", pane(ordinaryMessage() + CURRENT()))}
    </div>
  </section>`;

const variantSection = (v) => `
  <section class="variant" id="${v.id}">
    ${variantHead(v)}
    <div class="themes">
      ${themeCol("light", statesPane(v))}
      ${themeCol("dark", statesPane(v))}
    </div>
  </section>`;

/* Overview: the waiting state of every design, light and dark. */
const overview = () => {
  const rows = [{ name: "Current card (beta)", body: () => ordinaryMessage() + CURRENT() },
    ...VARIANTS.map((v) => ({ name: v.name, body: () => ordinaryMessage() + v.render(STATES[0]) }))];
  return `<header class="page-head"><h1>Urgent alert card: the current card and four variants (waiting state)</h1></header>` +
    rows.map((r) => `<section class="variant"><header class="variant-head"><h2>${r.name}</h2></header>
      <div class="themes">${themeCol("light", pane(r.body()))}${themeCol("dark", pane(r.body()))}</div></section>`).join("");
};

const params = new URLSearchParams(location.search);
const shot = params.get("shot");
const app = document.getElementById("app");
if (!shot) {
  app.innerHTML = `
    <header class="page-head">
      <h1>Urgent alert card: four variants</h1>
      <p>Mockups only. Colors, sizes and radii come from the app's app-theme.css (light in :root, dark in .dark); the current card and the folded row are drawn with the real chat-urgent-alert.css. Every variant shows every state the card has, in the 768px chat column next to an ordinary message, with the card in the messages' text column (624px at most).</p>
    </header>
    ${currentSection()}
    ${VARIANTS.map(variantSection).join("")}`;
} else {
  document.body.classList.add("is-shot");
  const [id, theme] = shot.split("-");
  if (theme === "dark") document.documentElement.classList.add("dark");
  let inner = "";
  if (shot === "overview") inner = overview();
  else if (id === "current") inner = currentSection();
  else {
    const v = VARIANTS.find((x) => x.id === id);
    inner = `<section class="variant" style="margin:0;width:768px">${variantHead(v)}<div>${statesPane(v)}</div></section>`;
  }
  app.innerHTML = `<div id="shot">${inner}</div>`;
}
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
